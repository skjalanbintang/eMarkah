<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>eMarkah SKJB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sistem markah ujian tahunan SK Jalan Bintang: guru isi markah, analisis subjek, kelas dan darjah, portal ibu bapa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky emerald top bar + left rail (stacks to a scrolling tab strip on phones); work area of dense tables on cream paper. */
:root{
  --bg:#f6f3ea; --paper:#fffdf7; --ink:#14251f; --muted:#5d6f67; --line:#e2dccb; --line2:#efe9da;
  --em:#0b6e4f; --em-ink:#ffffff; --em-soft:#dcefe5; --em-deep:#07513a; --gold:#c9962b; --gold-soft:#f7ecd2;
  --danger:#b4232c; --danger-soft:#fbe3e3; --warn:#9a6a00; --bar:#07513a; --bar-ink:#f5f1e4;
  --in-ink:#ffffff; --c1:#0b6e4f; --c2:#c9962b; --c3:#2f6fb0; --c4:#b4532c; --c5:#7a4fa8; --c6:#2f938a; --c7:#a03b6b; --c8:#6b7a2a;
  --gA:#0b7a4b; --gB:#3f9b3a; --gC:#a08a12; --gD:#c76a12; --gE:#c9481f; --gF:#b4232c; --gTH:#7b7f86;
  --font-d:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-b:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --paper:#16211c; --ink:#e8efe9; --muted:#9db1a7; --line:#2a3a33; --line2:#203029;
  --em:#2fb383; --em-ink:#06140e; --em-soft:#173b2d; --em-deep:#7fd6b2; --gold:#e2b552; --gold-soft:#3a3018;
  --danger:#ff7b7b; --danger-soft:#3c1d1f; --warn:#e6b84c; --bar:#0c3d2d; --bar-ink:#e9f3ec;
  --in-ink:#0b1410; --c1:#3fcf8e; --c2:#e2b552; --c3:#6fa8ff; --c4:#f08a5d; --c5:#b48cf0; --c6:#5fd1c2; --c7:#ef7fb0; --c8:#b8c86a;
  --gA:#3fcf8e; --gB:#8ad16f; --gC:#e0c64a; --gD:#f0a050; --gE:#f07e5a; --gF:#ff6b6b; --gTH:#9aa0a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --paper:#16211c; --ink:#e8efe9; --muted:#9db1a7; --line:#2a3a33; --line2:#203029;
  --em:#2fb383; --em-ink:#06140e; --em-soft:#173b2d; --em-deep:#7fd6b2; --gold:#e2b552; --gold-soft:#3a3018;
  --danger:#ff7b7b; --danger-soft:#3c1d1f; --warn:#e6b84c; --bar:#0c3d2d; --bar-ink:#e9f3ec;
  --in-ink:#0b1410; --c1:#3fcf8e; --c2:#e2b552; --c3:#6fa8ff; --c4:#f08a5d; --c5:#b48cf0; --c6:#5fd1c2; --c7:#ef7fb0; --c8:#b8c86a;
  --gA:#3fcf8e; --gB:#8ad16f; --gC:#e0c64a; --gD:#f0a050; --gE:#f07e5a; --gF:#ff6b6b; --gTH:#9aa0a8; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);min-height:100%}
body{color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.02rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,table{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.stack{display:grid;gap:14px;align-content:start}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:8px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--em)}
.btn.pri{background:var(--em);border-color:var(--em);color:var(--em-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1404}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;min-width:0}
.inp:focus{border-color:var(--em);outline:none;box-shadow:0 0 0 3px var(--em-soft)}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
label.f .inp{color:var(--ink);font-weight:400;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--em);color:var(--em-ink)}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:min(940px,100%);display:grid;grid-template-columns:1.05fr 1fr;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.login-hero{background:var(--bar);color:var(--bar-ink);padding:34px;display:grid;align-content:space-between;gap:28px;position:relative;overflow:hidden}
.login-hero h1{font-size:clamp(2rem,4.4vw,3rem);line-height:1;font-weight:800}
.login-hero .grid-deco{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;opacity:.95}
.login-hero .grid-deco span{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:12px;background:rgba(255,255,255,.1)}
.login-hero .grid-deco span.a{background:var(--gold);color:#1b1404}
.login-body{padding:30px;display:grid;gap:18px;align-content:start}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--em);border-color:var(--em)}
.demo-note{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:12.5px}
.demo-note code{font-weight:700}
@media (max-width:760px){.login-card{grid-template-columns:1fr}.login-hero{padding:24px}.login-hero .grid-deco{display:none}}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .brand{font-family:var(--font-d);font-weight:800;font-size:1.15rem}
.top .brand small{font-family:var(--font-b);font-weight:500;opacity:.8;font-size:12px;margin-left:8px}
.top select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:7px;padding:5px 8px}
.top select option{color:#14251f;background:#fff}
.top .who{font-size:12.5px;opacity:.9}
.top .btn{background:transparent;border-color:rgba(255,255,255,.35);color:inherit}
.shell{display:grid;grid-template-columns:200px 1fr;min-height:calc(100% - 56px)}
.nav{border-right:1px solid var(--line);padding:16px 10px;display:grid;gap:2px;align-content:start;position:sticky;top:56px;height:calc(100vh - 56px)}
.nav button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;gap:10px;align-items:center}
.nav button:hover{background:var(--line2);color:var(--ink)}
.nav button.on{background:var(--em-soft);color:var(--em-deep)}
.nav .ico{width:18px;text-align:center;font-family:var(--font-d);font-weight:800}
.main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:grid;gap:18px;align-content:start}
@media (min-width:900px){.main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.nav{position:static;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px))}.nav button{white-space:nowrap}}
.head{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h3{margin-bottom:10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.banner{border-radius:9px;padding:10px 12px;font-size:13px;background:var(--gold-soft)}
.banner.lock{background:var(--danger-soft);color:var(--danger)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.stat b{font-family:var(--font-d);font-size:1.8rem;line-height:1.05}
.prog{height:6px;background:var(--line2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--em)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th,.t td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:center;white-space:nowrap}
.t th{background:var(--em-soft);color:var(--em-deep);font-weight:700;font-size:12px;position:sticky;top:0;z-index:1}
.t td.l,.t th.l{text-align:left}
.t tr:last-child td{border-bottom:0}
.t tr.sum td{background:var(--gold-soft);font-weight:700}
.t tbody tr:hover td{background:var(--line2)}
.t .name{white-space:normal;min-width:190px;max-width:300px}
.t .sticky{position:sticky;left:0;background:var(--paper);z-index:2}
.t th.sticky{z-index:3;background:var(--em-soft)}
.pct{color:var(--muted);font-size:11.5px}
.g{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:6px;font-weight:700;font-size:12px;color:#fff}
.g-A{background:var(--gA)}.g-B{background:var(--gB)}.g-C{background:var(--gC)}.g-D{background:var(--gD)}.g-E{background:var(--gE)}.g-F{background:var(--gF)}.g-TH{background:var(--gTH)}
:root[data-theme="dark"] .g{color:#0b1410}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g{color:#0b1410}}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--em-soft);color:var(--em-deep)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.pill.mid{background:var(--gold-soft);color:var(--warn)}
.up{color:var(--gA);font-weight:700}.down{color:var(--gF);font-weight:700}

/* mark entry */
.mk{width:58px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:5px 2px;background:var(--bg)}
.mk:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 3px var(--em-soft);background:var(--paper)}
.mk.bad{border-color:var(--danger);background:var(--danger-soft)}
.mk:disabled{opacity:.6}
.save-st{font-size:12px;color:var(--muted)}
.save-st.ok{color:var(--em)}

/* stacked grade bar */
.gbar{display:flex;height:12px;border-radius:4px;overflow:hidden;min-width:120px;background:var(--line2)}
.gbar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* slip */
.slip{background:var(--paper);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;overflow:hidden}
.slip-h{background:var(--bar);color:var(--bar-ink);padding:16px 20px;display:flex;gap:14px;align-items:center}
.slip-h .crest{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1b1404;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;flex:none}
.slip-b{padding:16px 20px;display:grid;gap:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:20px;font-size:12px;text-align:center}
.sign div{border-top:1px dotted var(--muted);padding-top:6px}
.slips{display:grid;gap:18px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--paper);border-radius:14px;padding:20px;width:min(520px,100%);display:grid;gap:14px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}

/* parent */
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kid{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;text-align:left;display:grid}
.kid.on{border-color:var(--em);box-shadow:0 0 0 3px var(--em-soft)}
.trend{display:grid;gap:8px}
.trend .tr{display:grid;grid-template-columns:minmax(90px,170px) 1fr;gap:10px;align-items:center;font-size:12.5px}
.trend .bars{display:grid;gap:3px}
.trend .bar{height:10px;border-radius:3px;background:var(--em);display:flex;align-items:center}
.trend .bar span{font-size:10.5px;margin-left:calc(100% + 6px);white-space:nowrap;color:var(--muted)}
.ex-key{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ex-key i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.chk{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;margin-right:6px}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:320px}
@media print{
  body::before,.top,.nav,.toolbar,.noprint,.head .btn{display:none!important}
  .shell{display:block}.main{padding:0}
  .slip{border:0;page-break-after:always;max-width:none}
  .slip-h{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .g,.t th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* exam tabs, save bar, audit */
.extabs{display:flex;border-bottom:2px solid var(--line);overflow-x:auto}
.extabs button{border:0;background:none;padding:10px 18px 9px;display:grid;gap:2px;text-align:left;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted);white-space:nowrap;border-radius:8px 8px 0 0}
.extabs .ex-n{font-family:var(--font-d);font-weight:700;font-size:1rem}
.extabs .ex-m{font-size:11.5px}
.extabs button.on{color:var(--em-deep);border-bottom-color:var(--em);background:var(--em-soft)}
.extabs button:hover:not(.on){color:var(--ink);background:var(--line2)}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.10);z-index:5}
.savebar.dirty{border-color:var(--gold);background:var(--gold-soft)}
.savebar .btn{min-width:170px;justify-content:center}
.save-st.err{color:var(--danger);font-weight:600}
.auditbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px}
.mk.chg,.inp.chg{border-color:var(--gold);background:var(--gold-soft)}
.t tfoot td{background:var(--line2);font-size:11px;line-height:1.25;vertical-align:top}
.t tfoot td.sticky{background:var(--line2)}
/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--muted);font-size:11px;font-family:var(--font-b)}
.ch text.val{fill:var(--ink);font-weight:700}
.ch text.in{fill:var(--in-ink);font-weight:700;font-size:10.5px}
.ch .grid{stroke:var(--line2);stroke-width:1}
.ch .axis{stroke:var(--line);stroke-width:1}
/* semakan */
.smt td{padding:3px}
.cell{border:0;border-radius:7px;padding:5px 6px;min-width:66px;width:100%;display:grid;gap:1px;line-height:1.2}
.cell b{font-size:13px}
.cell span{font-size:10.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.cell.ok{background:var(--em-soft);color:var(--em-deep)}
.cell.part{background:var(--gold-soft);color:var(--warn)}
.cell.none{background:var(--danger-soft);color:var(--danger)}
.cell.opt{background:var(--line2);color:var(--muted)}
.guru-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px;margin-top:10px}
.gl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.gl ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.linkbtn{border:0;background:none;padding:0;color:var(--em);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-align:left}
/* switches */
.slipset{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
@media (max-width:900px){.slipset{grid-template-columns:1fr}}
.toggles{display:grid;gap:0}
.toggles label{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line2);cursor:pointer}
.sw{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:24px;transition:background .15s}
.sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:var(--paper);border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--em)}
.sw input:checked+span::before{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
@media print{.savebar,.extabs{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

<script>
/* =========================================================
   eMarkah SKJB — sistem markah ujian tahunan
   ---------------------------------------------------------
   KONFIGURASI PENGHOSAN (GitHub Pages / Firebase Hosting):
   Tampal firebaseConfig projek anda di bawah. Jika dibiarkan
   null, aplikasi berjalan dalam MOD DEMO (data dalam pelayar).
   ========================================================= */
const FIREBASE_CONFIG = null; /* contoh: { apiKey:"...", authDomain:"skjb-icthub.firebaseapp.com", projectId:"skjb-icthub", ... } */
const ADMIN_EMAILS = [];      /* emel pentadbir utama, cth: ["pentadbir@moe-dl.edu.my"] */
const FB_VER = "10.12.2";

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function skalaSorted(cfg = S.cfg) { return [...cfg.skala].sort((a, b) => b.min - a.min); }
function gradeOf(v, cfg = S.cfg) {
  if (v === "TH") return "TH"; if (v == null || v === "") return "";
  const n = +v; for (const s of skalaSorted(cfg)) if (n >= s.min) return s.g; return skalaSorted(cfg).at(-1).g;
}
function mataOf(g, cfg = S.cfg) { const i = skalaSorted(cfg).findIndex(s => s.g === g); return i < 0 ? null : i + 1; }
function labelOf(g, cfg = S.cfg) { if (g === "TH") return "TIDAK HADIR"; return skalaSorted(cfg).find(s => s.g === g)?.label || ""; }
function lulusOf(g, cfg = S.cfg) { return !!skalaSorted(cfg).find(s => s.g === g)?.lulus; }
const KEP_GAGAL = "BELUM MENCAPAI TAHAP MINIMUM";
const kepPill = kp => kp ? `<span class="pill ${kp === "LULUS" ? "ok" : kp === "TIDAK HADIR" ? "mid" : "no"}">${kp === KEP_GAGAL ? "BELUM CAPAI MINIMUM" : kp}</span>` : "–";
function parseMark(s) {
  s = String(s ?? "").trim().toUpperCase();

  if (s === "TH" || s === "T") return { ok: true, v: "TH" };
  if (!/^\d{1,3}(\.\d+)?$/.test(s)) return { ok: false };
  const n = +s; if (n > 100) return { ok: false }; return { ok: true, v: n };
}
function kira(rec, subjList, cfg = S.cfg) {
  const m = rec?.m || {}; const rows = []; const cnt = {}; let jum = 0, hadir = 0, mata = 0, ada = 0, gagal = false;
  for (const s of subjList) {
    const v = m[s.kod]; if (v == null || v === "") continue;
    ada++; const g = gradeOf(v, cfg); rows.push({ kod: s.kod, nama: s.nama, v, g, label: labelOf(g, cfg) });
    cnt[g] = (cnt[g] || 0) + 1; if (v === "TH") continue;
    hadir++; jum += +v; mata += mataOf(g, cfg); if (!lulusOf(g, cfg)) gagal = true;
  }
  const order = [...skalaSorted(cfg).map(s => s.g), "TH"];
  const analisis = order.filter(g => cnt[g]).map(g => `${cnt[g]}[${g}]`).join(" ");

  const th = cnt.TH || 0, maxM = skalaSorted(cfg).length;
  const keputusan = !ada ? "" : !hadir ? "TIDAK HADIR" : gagal ? KEP_GAGAL : "LULUS";
  return { rows, cnt, gagal: gagal ? 1 : 0, jumlah: jum, hadir, ada, purata: hadir ? jum / hadir : null, gp: hadir ? (mata + th * maxM) / (hadir + th) : null, keputusan, analisis, ulasan: rec?.ulasan || "", kehadiran: rec?.hadir || "" };
}
function rank(list, key) {
  /* same order as the school's Excel: passing pupils first, then lowest GP, then highest total */
  const r = list.filter(x => x.k.hadir > 0).sort((a, b) => (a.k.gagal - b.k.gagal) || (a.k.gp - b.k.gp) || (b.k.jumlah - a.k.jumlah) || a.m.nama.localeCompare(b.m.nama));
  r.forEach((x, i) => { x[key] = i + 1; x[key + "N"] = r.length; });
}

function hasilDarjah(ujian, d) {

function aggSubjek(rows, kod) {
  const c = { daftar: 0, hadir: 0, mata: 0, lulus: 0 }; const g = {};
  for (const r of rows) {
    const it = r.k.rows.find(x => x.kod === kod); if (!it) continue;
    c.daftar++; g[it.g] = (g[it.g] || 0) + 1; if (it.g === "TH") continue;

  const g = {}; let ent = 0, mata = 0, th = 0; let daftar = 0, hadir = 0, lulus = 0, gagal = 0;
  for (const r of rows) {

  let n = 1; const murid = {}; const mk = { U1: {}, U2: {} };
  for (const k of cfg.kelas) {
    murid[k.id] = [];
    for (let i = 0; i < 12; i++) {
      const f = first[Math.floor(rnd() * first.length)], l = last[Math.floor(rnd() * last.length)];
      const nama = l[0] ? `${f} ${l[0]} ${l[1]}` : `${l[1].split(" ")[0]} ${f} ${l[1].split(" ").slice(1).join(" ")}`.trim();
      const islam = l[0] === "BIN" || l[0] === "BINTI";
      const ic = (k.darjah == 6 ? "1405" : "1506") + String(10 + (n % 18)).padStart(2, "0") + "13" + String(9000 + n).padStart(4, "0");
      const m = { id: "m" + n, ic, nama, pin: n === 1 ? "DEMO26" : genPin(), agama: islam }; murid[k.id].push(m); n++;
      const ab = lvl[k.id] + (rnd() - .5) * 30;
      for (const u of ["U1", "U2"]) {
        mk[u][k.id] = mk[u][k.id] || {};
        const rec = { m: {}, ulasan: "", hadir: "" };
        for (const s of cfg.subjek.filter(s => s.darjah.includes(k.darjah))) {
          if (["PI", "PM"].includes(s.kod) && (s.kod === "PI") !== islam) continue;
          if (s.kod === "BA" && !islam) continue; if (s.kod === "BC" && islam) continue;
          if (u === "U2" && ((k.id === "k6c" && s.kod === "MT" && i < 4) || (k.id === "k5a" && s.kod === "SN") || (k.id === "k6b" && s.kod === "PMZ" && i > 8))) continue;
          if (rnd() < .012) { rec.m[s.kod] = "TH"; continue; }
          const v = Math.round(Math.max(5, Math.min(100, ab + (u === "U2" ? 4 : 0) + (rnd() - .5) * 34)));
          rec.m[s.kod] = v;
        }
        const r = kira(rec, cfg.subjek.filter(s => s.darjah.includes(k.darjah)), cfg);
        rec.ulasan = r.gp < 1.8 ? cfg.ulasan[0] : r.gp < 2.6 ? cfg.ulasan[2] : r.gp < 3.4 ? cfg.ulasan[4] : cfg.ulasan[9];
        rec.hadir = `${55 + Math.floor(rnd() * 6)}/60`;
        mk[u][k.id][m.id] = rec;
      }
    }
  }
  const GS = { BM: "CIKGU AZLINA (DEMO)", BI: "CIKGU JENNY ANAK LAING (DEMO)", MT: "CIKGU FARID HAKIMI (DEMO)", SN: "CIKGU MEI LING (DEMO)", SEJ: "CIKGU NURUL AIN (DEMO)", PMZ: "CIKGU DAVID LAWAI (DEMO)" };
  cfg.guruSubjek = {}; for (const k of cfg.kelas) { cfg.guruSubjek[k.id] = {}; for (const kod in GS) cfg.guruSubjek[k.id][kod] = GS[kod]; }
  const au = {}; for (const u in mk) for (const k of cfg.kelas) { const a = au[u + "_" + k.id] = {}; const t = new Date(Date.now() - (u === "U1" ? 60 : 3) * 864e5 - Math.floor(rnd() * 864e5)).toISOString();
    for (const s of cfg.subjek.filter(s => s.darjah.includes(k.darjah))) if (Object.values(mk[u][k.id]).some(r => r.m[s.kod] != null)) a[s.kod] = { nama: GS[s.kod] || k.guru, emel: "demo", masa: t };
    a._ulasan = { nama: k.guru, emel: "demo", masa: t }; }
  await db.set("app", "meta", { tahunAktif: y, tahunList: [y], demo: true, seedVer: 2 });
  await db.set("tahun", y, cfg);
  for (const k in murid) await db.set("murid", `${y}_${k}`, { senarai: murid[k] });
  for (const u in mk) for (const k in mk[u]) await db.set("markah", `${y}_${u}_${k}`, { data: mk[u][k], audit: au[u + "_" + k] || {} });
}

/* ---------------- SVG CHARTS (no library; colours from theme tokens) ---------------- */
const SER = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];
const gpCol = v => v == null ? "var(--gTH)" : v <= 2 ? "var(--gA)" : v <= 3 ? "var(--gB)" : v <= 4 ? "var(--gC)" : v <= 5 ? "var(--gD)" : "var(--gF)";
function niceMax(v) { if (!(v > 0)) return 4; const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw) * 4; }
function svgBar({ labels, values, max, fmtv = v => fmt(v), colors, h = 250, yfmt = v => Number.isInteger(+v.toFixed(6)) ? String(Math.round(v)) : fmt(v, 1), titles }) {
  const W = 640, n = labels.length, rot = n > 7, L = 38, R = 8, T = 18, B = rot ? 64 : 34, H = h;
  const vals = values.map(v => v == null ? null : +v); const mx = max ?? niceMax(Math.max(0, ...vals.filter(v => v != null)) * 1.12);
  const ih = H - T - B, iw = (W - L - R) / Math.max(1, n), y = v => T + ih - (v / mx) * ih;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = mx * i / 4; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${yfmt(v)}</text>`; }
  vals.forEach((v, i) => {
    const w = Math.min(iw * .64, 70), cx = L + i * iw + iw / 2, x = cx - w / 2;
    if (v != null) g += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, T + ih - y(v))}" rx="3" style="fill:${colors ? colors[i] : "var(--em)"}"><title>${esc((titles || labels)[i])}: ${esc(fmtv(v))}</title></rect><text class="val" x="${cx}" y="${y(v) - 5}" text-anchor="middle">${esc(fmtv(v))}</text>`;
    g += rot ? `<text x="${cx}" y="${T + ih + 12}" text-anchor="end" transform="rotate(-38 ${cx} ${T + ih + 12})">${esc(labels[i])}</text>` : `<text x="${cx}" y="${T + ih + 18}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}"/></svg>`;
}
function svgStack(rows) {
  /* rows: [{label, cnt:{A:..}, tot, bold}] → 100% stacked horizontal bars */
  const W = 640, L = 112, R = 18, rh = 30, H = rows.length * rh + 26, iw = W - L - R; let g = "";
  [0, 25, 50, 75, 100].forEach(p => { const x = L + iw * p / 100; g += `<line class="grid" x1="${x}" x2="${x}" y1="4" y2="${H - 20}"/><text x="${x}" y="${H - 6}" text-anchor="middle">${p}%</text>`; });
  rows.forEach((r, i) => {
    const y = 6 + i * rh; let x = L;
    g += `<text x="${L - 8}" y="${y + 15}" text-anchor="end" class="${r.bold ? "val" : ""}">${esc(r.label)}</text>`;
    for (const gr of GC()) { const v = r.cnt[gr] || 0; if (!v || !r.tot) continue; const w = iw * v / r.tot;
      g += `<rect x="${x}" y="${y}" width="${w}" height="${rh - 8}" style="fill:${gcol(gr)}"><title>${esc(r.label)} · ${gr}: ${v} (${fmt(pc(v, r.tot), 1)}%)</title></rect>`;
      if (w > 30) g += `<text class="in" x="${x + w / 2}" y="${y + 15}" text-anchor="middle">${fmt(pc(v, r.tot), 0)}%</text>`; x += w; }
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function svgLine({ labels, series, min = 1, max = 6, invert = true, h = 260 }) {
  const W = 640, L = 38, R = 120, T = 16, B = 34, H = h, ih = H - T - B, n = labels.length;
  const x = i => n === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1);
  const y = v => invert ? T + (v - min) / (max - min) * ih : T + ih - (v - min) / (max - min) * ih;
  let g = "";
  const st = (max - min) > 2.5 ? 1 : .5;
  for (let v = min; v <= max + 1e-9; v += st) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v, 1)}</text>`;
  labels.forEach((l, i) => g += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(l)}</text>`);
  const ends = [];
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v), v]).filter(Boolean); if (!pts.length) return;
    g += `<polyline points="${pts.map(p => p[0] + "," + p[1]).join(" ")}" style="fill:none;stroke:${s.color};stroke-width:${s.bold ? 3.5 : 2}"/>`;
    pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="${s.bold ? 4.5 : 3.5}" style="fill:${s.color}"><title>${esc(s.name)}: ${fmt(p[2])}</title></circle>`);
    const lp = pts.at(-1); ends.push({ y: lp[1], t: `${s.name} ${fmt(lp[2])}`, c: s.color, b: s.bold });
  });
  ends.sort((a, b) => a.y - b.y); let last = -99; ends.forEach(e => { e.y = Math.max(e.y, last + 13); last = e.y; g += `<text x="${W - R + 8}" y="${e.y + 4}" style="fill:${e.c};font-weight:${e.b ? 700 : 600}">${esc(e.t)}</text>`; });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}"/></svg>`;
}
function chartCard(title, note, svg, extra = "") { return `<section class="panel chart"><h3>${title}</h3>${note ? `<p class="muted small" style="margin:2px 0 8px">${note}</p>` : ""}${svg}${extra}</section>`; }

    const a = (S.audit[mkKey(uId, k.id)] || {})[s.kod];
    out.push({ d, k, s, bil: ms.length, isi: ms.length - kosong.length, kosong, a, guru: guruSubjek(k.id, s.kod) || a?.nama || "" , guruTetap: !!guruSubjek(k.id, s.kod) });
  }

}

function parseWorkbook(wb) {
  const out = { kelas: [], subjBaru: [] }; const known = new Set(S.cfg.subjek.map(s => s.kod));
  const cellV = (ws, r, c) => { const x = ws[XLSX.utils.encode_cell({ r, c })]; return x ? (x.v ?? "") : ""; };
  const nameD = n => { const m = String(n).match(/^\s*(\d)/); return m ? +m[1] : 6; };
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name]; if (!ws["!ref"]) continue; const R = XLSX.utils.decode_range(ws["!ref"]);
    /* Format 1: class sheet */
    if (String(cellV(ws, 0, 1)).trim().toUpperCase() === "KELAS" && String(cellV(ws, 1, 1)).trim().toUpperCase() === "NO IC") {
      const kn = String(cellV(ws, 0, 2)).trim(); if (!kn) continue;
      const cols = []; let ulCol = -1, hdCol = -1;
      for (let c = 4; c <= R.e.c; c++) {
        const h = String(cellV(ws, 1, c)).trim().toUpperCase(); if (!h) continue;
        if (h === "ULASAN GURU KELAS") ulCol = c; else if (h === "KEHADIRAN") hdCol = c;
        else if (c < 55 && (c - 4) % 2 === 0 && /^[A-Z]{1,6}$/.test(h) && !/ G$/.test(h)) { cols.push({ c, kod: h }); if (!known.has(h) && !out.subjBaru.includes(h)) out.subjBaru.push(h); }
      }
      const k = { nama: kn, darjah: nameD(kn), murid: [] };
      for (let r = 2; r <= R.e.r; r++) {
        const nama = String(cellV(ws, r, 2)).trim(); if (!nama || nama === "#N/A") continue;
        const ic = normIC(cellV(ws, r, 1)); const m = {};
        for (const { c, kod } of cols) { const p = parseMark(cellV(ws, r, c)); if (p.ok && p.v != null) m[kod] = p.v; }
        k.murid.push({ ic, nama: nama.toUpperCase(), m, ulasan: ulCol >= 0 ? String(cellV(ws, r, ulCol)).trim() : "", hadir: hdCol >= 0 ? String(cellV(ws, r, hdCol)).trim() : "" });
      }
      if (k.murid.length) out.kelas.push(k);
      continue;
    }
    /* Format 2: simple list (only when the workbook has no class sheets) */
    if (wb.SheetNames.some(n => { const w = wb.Sheets[n]; return String(cellV(w, 0, 1)).trim().toUpperCase() === "KELAS" && String(cellV(w, 1, 1)).trim().toUpperCase() === "NO IC"; })) continue;
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
    const isNama = x => /^NAMA( (MURID|PELAJAR|PENUH))?$/i.test(String(x).trim());
    const hi = rows.findIndex(r => r.some(isNama) && r.some(x => /^KELAS$/i.test(String(x).trim())));
    if (hi < 0) continue;
    const H = rows[hi].map(x => String(x).trim().toUpperCase());
    const ci = H.findIndex(x => /^(NO\.? ?IC|NO\.? ?KP|MYKID|NO\.? ?MYKID|IC)/.test(x)), ni = H.findIndex(isNama), ki = H.indexOf("KELAS");
    const subjCols = H.map((h, i) => ({ h, i })).filter(x => known.has(x.h));
    for (const r of rows.slice(hi + 1)) {
      const nama = String(r[ni] || "").trim(), kn = String(r[ki] || "").trim(); if (!nama || !kn) continue;
      let k = out.kelas.find(x => x.nama.toUpperCase() === kn.toUpperCase()); if (!k) out.kelas.push(k = { nama: kn.toUpperCase(), darjah: nameD(kn), murid: [] });
      const m = {}; for (const s of subjCols) { const p = parseMark(r[s.i]); if (p.ok && p.v != null) m[s.h] = p.v; }
      k.murid.push({ ic: ci >= 0 ? normIC(r[ci]) : "", nama: nama.toUpperCase(), m, ulasan: "", hadir: "" });
    }
  }
  return out;
}
async function applyImport(p, ujian) {
  const c = S.cfg; let baru = 0, kemas = 0;
  for (const kod of p.subjBaru) c.subjek.push({ kod, nama: kod, darjah: ALL });
  const allM = () => c.kelas.flatMap(k => muridOf(k.id).map(m => ({ m, k })));
  const touched = new Set(), touchedMk = new Set();
  for (const ik of p.kelas) {

  for (const key of touchedMk) { const au = S.audit[key] = S.audit[key] || {}; for (const mid in S.markah[key]) for (const kod in (S.markah[key][mid].m || {})) au[kod] = oleh; }
  await saveCfg(); for (const kid of touched) await saveMurid(kid); for (const key of touchedMk) await saveMarkahNow(key);
  if (!S.sel.kelas) { S.sel.kelas = c.kelas[0]?.id; S.sel.muridKelas = S.sel.kelas; S.sel.slipKelas = S.sel.kelas; S.sel.darjah = darjahList()[0]; }

}
function exportKelas(ujian, kid) {

/* ---------------- PORTAL PUBLISH ---------------- */
async function publishPortal() {
  const c = S.cfg; const terbit = c.ujian.filter(u => u.terbit); let n = 0; const so = slipOpt();
  const cache = {}; for (const u of terbit) for (const d of darjahList()) cache[u.id + "|" + d] = hasilDarjah(u.id, d);
  const jobs = [];
  for (const k of c.kelas) for (const m of muridOf(k.id)) jobs.push(async () => {
    const ex = terbit.map(u => { const r = cache[u.id + "|" + k.darjah].find(x => x.m.id === m.id);
      const kk = { ...r.k, ulasan: so.ulasan ? r.k.ulasan : "", kehadiran: so.kehadiran ? r.k.kehadiran : "" };
      return { id: u.id, nama: u.nama, k: kk, kdk: so.kdk ? r.kdk || null : null, kdkN: so.kdk ? r.kdkN || null : null, kdt: so.kdt ? r.kdt || null : null, kdtN: so.kdt ? r.kdtN || null : null }; });
    const doc = { nama: m.nama, ic: m.ic.length > 4 ? "••••••••" + m.ic.slice(-4) : m.ic, kelas: k.nama, darjah: k.darjah, guru: k.guru || "", tahun: S.tahun, sekolah: c.sekolah, skala: c.skala, slip: so, ujian: ex, dikemas: new Date().toISOString() };
    const h = await portalKey(m.ic, m.pin);
    if (m._ph && m._ph !== h) await S.db.del("portal", `${m._ph}_${S.tahun}`).catch(() => { });
    await S.db.set("portal", `${h}_${S.tahun}`, doc); m._ph = h; n++;
  });
  for (let i = 0; i < jobs.length; i += 25) await Promise.all(jobs.slice(i, i + 25).map(f => f()));
  for (const k of c.kelas) await saveMurid(k.id);
  c.portalDikemas = new Date().toISOString(); await saveCfg();
  return n;
}

  const docs = [];
  for (const y of years) { try { const d = await S.db.get("portal", `${h}_${y}`); if (d) docs.push(d); } catch (e) { } }

  $$("[data-ut]").forEach(i => i.onchange = async () => { c.ujian[+i.dataset.ut].terbit = i.checked; await saveCfg(); toast("Klik Kemas kini portal untuk menghantar perubahan kepada ibu bapa."); });
  const prevSlip = () => {
    const u = c.ujian.find(x => x.id === S.sel.ujian) || c.ujian[0]; const k = c.kelas.find(x => muridOf(x.id).length); const box = $("#slipPrev"); if (!box) return;
    if (!k || !u) { box.innerHTML = `<p class="muted">Tiada murid untuk pratonton.</p>`; return; }
    const r = hasilDarjah(u.id, k.darjah).find(x => x.kelas.id === k.id);
    box.innerHTML = slipHTML({ sekolah: c.sekolah, ujianNama: u.nama, tahun: S.tahun, nama: r.m.nama, ic: r.m.ic, kelas: k.nama, guru: k.guru, gb: c.sekolah.gb, k: r.k, kdk: r.kdk, kdkN: r.kdkN, kdt: r.kdt, kdtN: r.kdtN, opt: slipOpt() });
  };
  prevSlip();
  $$("[data-sl]").forEach(i => i.onchange = async () => { c.slip = { ...slipOpt(), [i.dataset.sl]: i.checked }; prevSlip(); await saveCfg(); toast(`${SLIP_ITEMS.find(x => x[0] === i.dataset.sl)[1]}: ${i.checked ? "dipaparkan" : "disembunyikan"}`); });
  $("#pub").onclick = async () => { $("#pub").disabled = true; $("#pub").textContent = "Menerbitkan…"; try { const n = await publishPortal(); toast(`Portal dikemas kini untuk ${n} murid.`); } catch (e) { toast("Gagal: " + e.message); } render(); };
  /* sekolah */
  $("#sSave").onclick = async () => { Object.assign(c.sekolah, { nama: $("#sN").value.trim(), alamat: $("#sA").value.trim(), gb: $("#sG").value.trim(), url: $("#sU").value.trim() }); await saveCfg(); toast("Maklumat sekolah disimpan."); render(); };
  $("#nYGo").onclick = async () => {
    const y = $("#nY").value.trim(); if (!/^\d{4}$/.test(y) || S.meta.tahunList.includes(y)) return toast("Tahun tidak sah atau sudah wujud.");
    if (!(await ask(`Mula tahun <b>${y}</b> dan jadikan tahun aktif? Tetapan tahun ${S.tahun} akan disalin.`, "Mula"))) return;
    const nc = structuredClone(c); nc.tahun = y; nc.ujian.forEach(u => { u.kunci = false; u.terbit = false; }); delete nc.portalDikemas;
    await S.db.set("tahun", y, nc); S.meta.tahunList.push(y); S.meta.tahunAktif = y; await saveMeta(); await loadYear(y); toast("Tahun " + y + " dimulakan."); render();
  };
  /* kelas */
  const readKelas = () => c.kelas.forEach((k, i) => { k.nama = $(`[data-kn="${i}"]`).value.trim().toUpperCase(); k.darjah = +$(`[data-kd="${i}"]`).value; k.guru = $(`[data-kg="${i}"]`).value.trim().toUpperCase(); });
  $("#kAdd").onclick = () => { readKelas(); c.kelas.push({ id: "k" + uid(), nama: "KELAS BAHARU", darjah: 1, guru: "" }); render(); };
  $("#kSave").onclick = async () => { readKelas(); await saveCfg(); toast("Kelas disimpan."); render(); };
  $("#kImp").onclick = () => importDialog();
  $$("[data-kx]").forEach(b => b.onclick = async () => { const k = c.kelas[+b.dataset.kx]; if (muridOf(k.id).length && !(await ask(`Kelas <b>${esc(k.nama)}</b> ada ${muridOf(k.id).length} murid. Padam kelas dan semua murid serta markahnya?`, "Padam"))) return; readKelas(); c.kelas.splice(+b.dataset.kx, 1); delete S.murid[k.id]; await S.db.del("murid", `${S.tahun}_${k.id}`).catch(() => { }); for (const u of c.ujian) { delete S.markah[mkKey(u.id, k.id)]; await S.db.del("markah", `${S.tahun}_${mkKey(u.id, k.id)}`).catch(() => { }); } await saveCfg(); render(); });
  /* subjek */
  const readSubj = () => c.subjek.forEach((s, i) => { s.kod = $(`[data-sk="${i}"]`).value.trim().toUpperCase(); s.nama = $(`[data-sn="${i}"]`).value.trim().toUpperCase(); s.darjah = $$(`[data-sd="${i}"]`).filter(x => x.checked).map(x => +x.value); s.pilihan = $(`[data-sp="${i}"]`).checked; });
  $("#sbAdd").onclick = () => { readSubj(); c.subjek.push({ kod: "BARU", nama: "SUBJEK BAHARU", darjah: [...ALL] }); render(); };
  $("#sbSave").onclick = async () => { readSubj(); const k = c.subjek.map(s => s.kod); if (new Set(k).size !== k.length) return toast("Kod subjek mesti unik."); await saveCfg(); toast("Subjek disimpan."); render(); };
  $$("[data-sx]").forEach(b => b.onclick = async () => { const s = c.subjek[+b.dataset.sx]; if (!(await ask(`Padam subjek <b>${esc(s.nama)}</b>? Markah sedia ada tidak dipadam tetapi tidak lagi dipaparkan.`, "Padam"))) return; readSubj(); c.subjek.splice(+b.dataset.sx, 1); await saveCfg(); render(); });
  /* skala */
  $("#gSave").onclick = async () => { for (const s of c.skala) { s.min = +$(`[data-gm="${s.g}"]`).value; s.label = $(`[data-gl="${s.g}"]`).value.trim().toUpperCase(); s.lulus = $(`[data-gp="${s.g}"]`).checked; } await saveCfg(); toast("Skala gred disimpan."); render(); };
  $("#ulSave").onclick = async () => { c.ulasan = $("#ulT").value.split("\n").map(x => x.trim()).filter(Boolean); await saveCfg(); toast("Bank ulasan disimpan."); };
  /* db */
  $("#fbGo") && ($("#fbGo").onclick = async () => {
    const t = $("#fbT").value; let cfg = null;
    try { cfg = JSON.parse(t); } catch (e) { const o = {}; t.replace(/(\w+)\s*:\s*["']([^"']+)["']/g, (_, k, v) => o[k] = v); if (o.apiKey && o.projectId) cfg = o; }
    if (!cfg?.apiKey || !cfg?.projectId) return toast("Config tidak lengkap: perlu apiKey dan projectId.");
    LS.set("emarkah-fbconfig", cfg); toast("Config disimpan. Memuatkan semula…"); setTimeout(() => location.reload(), 700);
  });
  $("#fbOff") && ($("#fbOff").onclick = () => { LS.del("emarkah-fbconfig"); toast("Config dibuang. Memuatkan semula…"); setTimeout(() => location.reload(), 700); });
  $("#dReset") && ($("#dReset").onclick = async () => { if (!(await ask("Padam semua data dalam pelayar ini dan muat semula data contoh?", "Set semula"))) return; LS.keys().filter(k => k && k.startsWith("emarkah:")).forEach(k => LS.del(k)); await seedDemo(); S.meta = await S.db.get("app", "meta"); await loadYear(S.meta.tahunAktif); render(); });
  if (S.mode === "firebase") loadStaff();
};
async function loadStaff() {
  const box = $("#staffL"); if (!box) return;
  try {
    const list = await S.db.list("staff");
    box.innerHTML = list.length ? `<div class="tw"><table class="t"><thead><tr><th class="l">Nama</th><th class="l">Emel</th><th>Peranan</th><th></th></tr></thead><tbody>${list.map(s => `<tr><td class="l">${esc(s.data.nama)}</td><td class="l">${esc(s.id)}</td><td>${s.data.peranan === "admin" ? "Pentadbir" : "Guru"}</td><td>${s.id !== S.user.emel ? `<button class="btn sm danger" data-sdel="${esc(s.id)}">Buang akses</button>` : ""}</td></tr>`).join("")}</tbody></table></div>` : "Belum ada pengguna berdaftar.";
    $$("[data-sdel]").forEach(b => b.onclick = async () => { if (!(await ask(`Buang akses ${esc(b.dataset.sdel)}?`, "Buang"))) return; await S.db.del("staff", b.dataset.sdel); loadStaff(); });
  } catch (e) { box.textContent = "Gagal memuatkan: " + e.message; }
  const add = async (nama, email, pw, role) => {
    email = email.trim().toLowerCase();
    const sec = S.fb.initializeApp(S.fb.cfg, "sec" + Date.now()); const sa = S.fb.getAuth(sec);
    try { await S.fb.createUserWithEmailAndPassword(sa, email, pw); } catch (e) { if (e.code !== "auth/email-already-in-use") throw e; }
    finally { try { await S.fb.signOut(sa); await S.fb.deleteApp(sec); } catch (e) { } }
    await S.db.set("staff", email, { nama: nama.trim().toUpperCase(), peranan: role, emel: email });
  };
  $("#stAdd").onclick = async () => { const n = $("#stN").value, e = $("#stE").value, p = $("#stP").value, r = $("#stR").value; if (!n || !e || p.length < 6) return toast("Isi nama, emel dan kata laluan (min 6 aksara)."); try { await add(n, e, p, r); toast("Didaftarkan. Kata laluan sementara: " + p); loadStaff(); } catch (er) { toast("Gagal: " + er.message); } };
  $("#stBulkGo").onclick = async () => { const p = $("#stP").value; const lines = $("#stBulk").value.split("\n").map(l => l.split(/[,\t]/).map(x => x.trim())).filter(x => x[0] && x[1]); let ok = 0; for (const [n, e] of lines) { try { await add(n, e, p, "guru"); ok++; } catch (er) { console.warn(e, er); } } toast(`${ok}/${lines.length} guru didaftarkan. Kata laluan sementara: ${p}`); loadStaff(); };
}
const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function email() { return request.auth.token.email.lower(); }
    function staffDoc() { return /databases/$(database)/documents/staff/$(email()); }
    function isStaff() { return request.auth != null && request.auth.token.email != null
                          && (exists(staffDoc()) || isRootAdmin()); }
    function isRootAdmin() { return request.auth != null && request.auth.token.email != null
                          && email() in ['GANTI_DENGAN_EMEL_PENTADBIR@moe-dl.edu.my']; }
    function isAdmin() { return isRootAdmin() || (isStaff() && get(staffDoc()).data.peranan == 'admin'); }

    match /app/{doc}      { allow read: if true;      allow write: if isAdmin(); }
    match /tahun/{y}      { allow read: if isStaff(); allow write: if isAdmin(); }
    match /murid/{id}     { allow read: if isStaff(); allow write: if isAdmin(); }
    match /markah/{id}    { allow read, write: if isStaff(); }
    match /portal/{id}    { allow get: if true; allow list: if false; allow write: if isAdmin(); }
    match /staff/{em}     { allow get: if request.auth != null && (email() == em || isAdmin());
                            allow list, write: if isAdmin(); }
  }
}`;

window.addEventListener("beforeunload", e => { if (S.patch.size) { e.preventDefault(); e.returnValue = ""; } });
boot();
</script>
